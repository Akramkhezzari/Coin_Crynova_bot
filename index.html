<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #reels{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #reels::-webkit-scrollbar{display:none}
  .reel{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
  .reel video{width:100%;height:100%;object-fit:contain;background:#000}
  .caption{position:absolute;bottom:20px;right:16px;left:16px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);font-size:15px;line-height:1.4;max-height:40%;overflow:hidden}
  .meta{font-size:11px;opacity:.7;margin-top:6px}
  .actions{position:absolute;bottom:120px;left:12px;display:flex;flex-direction:column;gap:20px;font-size:26px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
  .actions span{cursor:pointer;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px}
  .actions .cnt{font-size:11px;filter:none;text-shadow:none}
  .like.liked{transform:scale(1.15);transition:transform .15s}
  .loading,.error{height:100dvh;display:flex;align-items:center;justify-content:center;color:#888;font-size:15px;padding:20px;text-align:center;flex-direction:column;gap:8px}
  .error{color:#f66}
  .empty{height:100dvh;display:flex;align-items:center;justify-content:center;color:#666;flex-direction:column;gap:12px;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="reels"><div class="loading">جارٍ جلب الفيديوهات...</div></div>

<script>
/* ═══════ الإعدادات ═══════ */
const CHANNEL = '@Crynova_dz';   // ← ضع اسم القناة بدون @ (مثال: 'mychannel')
const PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
  'https://api.codetabs.com/v1/proxy?quest='
];
/* ════════════════════════ */

async function fetchChannelHTML(){
  const target = `https://t.me/Crynova_dz`;
  let lastErr;
  for (const p of PROXIES){
    try{
      const r = await fetch(p + encodeURIComponent(target));
      if (r.ok) return await r.text();
      lastErr = new Error('HTTP ' + r.status);
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('فشل الاتصال بجميع الوسطاء');
}

function parseVideos(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const posts = doc.querySelectorAll('.tgme_widget_message');
  const out = [];
  posts.forEach(p => {
    const v = p.querySelector('video');
    if (!v) return;
    let src = v.getAttribute('src') || '';
    if (!src) return;
    if (src.startsWith('//')) src = 'https:' + src;
    else if (src.startsWith('/')) src = 'https://t.me' + src;
    const capEl = p.querySelector('.tgme_widget_message_text');
    const caption = capEl ? capEl.textContent.trim() : '';
    const timeEl = p.querySelector('time');
    const date = timeEl ? timeEl.getAttribute('datetime') : '';
    const viewsEl = p.querySelector('.tgme_widget_message_views');
    const views = viewsEl ? viewsEl.textContent.trim() : '';
    out.push({src, caption, date, views});
  });
  return out.reverse(); // الأحدث أولاً
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){ if(!iso) return ''; try{return new Date(iso).toLocaleDateString('ar',{year:'numeric',month:'short',day:'numeric'});}catch{return '';} }

function render(reels){
  const root = document.getElementById('reels');
  if (!reels.length){
    root.innerHTML = `<div class="empty"><div>لا توجد فيديوهات في آخر منشورات القناة</div><div style="font-size:12px;opacity:.6">تأكد أن القناة عامة وأن الاسم صحيح</div></div>`;
    return;
  }
  root.innerHTML = reels.map(r => `
    <div class="reel">
      <video src="${escapeHtml(r.src)}" loop playsinline preload="metadata" muted webkit-playsinline disablepictureinpicture controlslist="nodownload noplaybackrate"></video>
      <div class="actions">
        <span class="like">❤️<span class="cnt">0</span></span>
        <span class="share">↗️<span class="cnt">مشاركة</span></span>
      </div>
      ${r.caption ? `<div class="caption">${escapeHtml(r.caption)}<div class="meta">${fmtDate(r.date)}${r.views ? ' · 👁 '+escapeHtml(r.views) : ''}</div></div>` : ''}
    </div>`).join('');

  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      const v = e.target;
      if (e.intersectionRatio > 0.6){ v.muted = true; v.play().catch(()=>{}); }
      else v.pause();
    });
  }, {threshold:[0,0.6,1]});
  root.querySelectorAll('.reel video').forEach(v => io.observe(v));
}

document.addEventListener('click', e => {
  const like = e.target.closest('.like');
  if (like){
    like.classList.toggle('liked');
    const c = like.querySelector('.cnt');
    c.textContent = (+c.textContent||0) + (like.classList.contains('liked')?1:-1);
    return;
  }
  const share = e.target.closest('.share');
  if (share){
    const v = share.closest('.reel').querySelector('video');
    if (navigator.share) navigator.share({url: v.src}).catch(()=>{});
    else { navigator.clipboard?.writeText(v.src); alert('تم نسخ الرابط'); }
    return;
  }
  const vid = e.target.closest('.reel')?.querySelector('video');
  if (!vid) return;
  if (vid.paused){ vid.muted = false; vid.play(); } else vid.pause();
});

(async () => {
  try{
    const html = await fetchChannelHTML();
    render(parseVideos(html));
  }catch(e){
    document.getElementById('reels').innerHTML =
      `<div class="error">تعذر جلب الفيديوهات<div style="font-size:12px;opacity:.7;margin-top:8px">${escapeHtml(e.message)}</div><div style="font-size:11px;opacity:.5;margin-top:14px;max-width:260px">جرّب لاحقاً، أو تحقق أن القناة عامة، أو افتح الملف عبر سيرفر محلي (وليس file://)</div></div>`;
  }
})();
</script>
</body>
</html>
