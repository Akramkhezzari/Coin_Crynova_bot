<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>CoinTap — لعبة النقر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --gold-2:#ffd24a;--gold-3:#f59e0b;
  --glass:rgba(255,255,255,.055);
  --glass-brd:rgba(255,255,255,.1);
  --cs:clamp(150px,42vw,200px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden}
body{font-family:'Cairo',system-ui,sans-serif;background:#05060d;color:#fff;
  display:flex;justify-content:center;align-items:stretch}
.app{position:relative;width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;
  overflow:hidden;padding-bottom:env(safe-area-inset-bottom);
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255,180,40,.22), transparent 55%),
    radial-gradient(90% 50% at 8% 78%, rgba(60,200,255,.14), transparent 55%),
    radial-gradient(90% 50% at 95% 60%, rgba(160,80,255,.12), transparent 55%),
    linear-gradient(180deg,#0b0f22 0%,#070a15 45%,#04050c 100%)}
.app::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 78% 12%, #cfe7ff, transparent),
    radial-gradient(1.6px 1.6px at 62% 32%, #ffe9b0, transparent),
    radial-gradient(1.2px 1.2px at 28% 46%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 88% 58%, #d9c6ff, transparent),
    radial-gradient(1.2px 1.2px at 40% 72%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 70% 84%, #b9e8ff, transparent);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.65}}
.topbar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 6px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(145deg,#1e2647,#12172e);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
.uname{font-size:14px;font-weight:700}
.urank{font-size:11px;color:#ffd36b;font-weight:600;opacity:.9}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-brd);
  background:var(--glass);backdrop-filter:blur(14px);color:#cfd6ee;font-size:17px;
  display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.hud{position:relative;z-index:3;text-align:center;padding:8px 16px 0}
.balance-row{display:flex;align-items:center;justify-content:center;gap:10px}
.coin-mini{width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff6c9, #ffd24a 40%, #f59e0b 75%, #b45309);
  box-shadow:0 0 16px rgba(255,180,40,.65),inset 0 -3px 6px rgba(120,60,0,.5);
  display:grid;place-items:center;font-size:14px;color:#8a4b00;font-weight:900;
  animation:coinSpin 6s linear infinite}
@keyframes coinSpin{0%,80%{transform:rotateY(0)}90%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.balance{font-size:clamp(30px,9vw,42px);font-weight:900;letter-spacing:-1px;
  background:linear-gradient(180deg,#ffffff,#ffe9a8 55%,#ffc23c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(255,180,40,.45));line-height:1.1}
.profit{margin-top:2px;font-size:12px;font-weight:600;color:#8fe8ff;
  display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border-radius:20px;
  background:rgba(74,227,255,.08);border:1px solid rgba(74,227,255,.18)}
.profit .dot{width:6px;height:6px;border-radius:50%;background:#4ae3ff;
  box-shadow:0 0 8px #4ae3ff;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.tap-area{position:relative;flex:1;display:grid;place-items:center;z-index:2;
  overflow:hidden;min-height:0}
.coin-wrap{position:relative;display:grid;place-items:center;
  animation:coinFloat 3.4s ease-in-out infinite}
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ring{position:absolute;border-radius:50%;pointer-events:none;width:var(--cs);height:var(--cs);
  border:1.5px solid rgba(255,200,80,.35);animation:ringPulse 3s ease-out infinite}
.ring.r2{animation-delay:1.5s}
@keyframes ringPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.coin{width:var(--cs);height:var(--cs);border-radius:50%;position:relative;
  display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 34% 28%, #fffbe0 0%, #ffe27a 22%, #ffc93c 48%, #f59e0b 72%, #a8500a 100%);
  box-shadow:0 0 0 7px rgba(255,190,60,.10),0 0 55px rgba(255,168,20,.55),
    0 26px 45px -12px rgba(0,0,0,.85),inset 0 -14px 28px rgba(120,50,0,.55),
    inset 0 14px 26px rgba(255,255,255,.65);
  transition:transform .07s cubic-bezier(.34,1.6,.64,1);will-change:transform}
.coin.pressed{transform:scale(.92)}
.coin::before{content:'';position:absolute;inset:11%;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.4);
  box-shadow:inset 0 0 22px rgba(255,255,255,.3);pointer-events:none}
.coin::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,.5) 32deg, transparent 70deg,
    transparent 180deg, rgba(255,255,255,.35) 212deg, transparent 250deg);
  animation:shineSpin 5s linear infinite;mix-blend-mode:screen;opacity:.8}
@keyframes shineSpin{to{transform:rotate(360deg)}}
.symbol{position:relative;z-index:2;font-size:calc(var(--cs)*.42);font-weight:900;color:#9a5200;
  text-shadow:0 2px 0 rgba(255,255,255,.55);filter:drop-shadow(0 0 14px rgba(255,255,255,.65));
  pointer-events:none}
.float{position:absolute;font-weight:900;font-size:22px;color:#fff;pointer-events:none;z-index:20;
  white-space:nowrap;text-shadow:0 0 18px rgba(255,200,60,.95),0 3px 10px rgba(0,0,0,.7);
  animation:floatUp .95s cubic-bezier(.2,.7,.3,1) forwards;transform:translate(-50%,-50%)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  18%{opacity:1;transform:translate(-50%,-70%) scale(1.18)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(.9)}}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:15;
  border:2px solid rgba(255,215,90,.85);transform:translate(-50%,-50%);
  animation:rippleOut .6s ease-out forwards}
@keyframes rippleOut{0%{width:10px;height:10px;opacity:.9}100%{width:170px;height:170px;opacity:0}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:16;
  background:radial-gradient(circle,#fff,#ffc93c);box-shadow:0 0 10px #ffc93c;
  transform:translate(-50%,-50%)}
.energy-wrap{position:relative;z-index:3;padding:0 20px 10px}
.energy-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;
  font-weight:700;margin-bottom:6px}
.energy-top .lbl{color:#ffd36b}.energy-top .val{color:#9fb0d0;font-variant-numeric:tabular-nums}
.energy-bar{height:12px;border-radius:20px;overflow:hidden;position:relative;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.energy-fill{height:100%;width:100%;border-radius:20px;
  background:linear-gradient(90deg,#39e6a4,#4ae3ff 55%,#8b7bff);
  box-shadow:0 0 16px rgba(74,227,255,.7);transition:width .25s ease;position:relative}
.energy-fill::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sweep 2s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.energy-wrap.low .energy-fill{background:linear-gradient(90deg,#ff5a5a,#ff9f43);
  box-shadow:0 0 16px rgba(255,90,90,.75)}
.shake{animation:shakeIt .35s}
@keyframes shakeIt{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.boosts{position:relative;z-index:3;display:flex;gap:10px;overflow-x:auto;
  padding:2px 16px 12px;scrollbar-width:none}
.boosts::-webkit-scrollbar{display:none}
.boost{flex:0 0 auto;width:104px;padding:11px 9px 10px;border-radius:18px;cursor:pointer;
  text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  border:1px solid var(--glass-brd);backdrop-filter:blur(16px);
  box-shadow:0 8px 22px -10px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .16s cubic-bezier(.34,1.6,.64,1),border-color .2s;
  color:#fff;font-family:inherit}
.boost:active{transform:scale(.94)}
.boost.affordable{border-color:rgba(255,200,60,.45);
  box-shadow:0 8px 26px -8px rgba(255,180,40,.45),inset 0 1px 0 rgba(255,255,255,.14)}
.boost.affordable .b-cost{color:#ffd24a}
.b-ico{font-size:22px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(255,200,60,.5))}
.b-name{font-size:11px;font-weight:700;color:#dfe6fa;margin-bottom:2px;white-space:nowrap}
.b-lv{font-size:9.5px;color:#7d8ab0;font-weight:600;margin-bottom:6px}
.b-cost{font-size:11px;font-weight:800;color:#8fa0c4;display:flex;align-items:center;
  justify-content:center;gap:3px;padding:3px 0;border-radius:9px;background:rgba(0,0,0,.28)}
.b-cost .c{font-size:9px}
.nav{position:relative;z-index:4;display:flex;justify-content:space-around;align-items:center;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,14,28,.35),rgba(6,8,16,.95));
  border-top:1px solid rgba(255,255,255,.07);backdrop-filter:blur(20px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;
  border:none;color:#5f6b8c;font-family:inherit;font-size:10px;font-weight:700;
  cursor:pointer;padding:6px 0;transition:color .22s}
.nav-item .ni{font-size:19px;line-height:1;transition:transform .25s,filter .25s}
.nav-item.active{color:#ffd24a}
.nav-item.active .ni{transform:translateY(-3px) scale(1.14);filter:drop-shadow(0 0 10px rgba(255,200,60,.85))}
.nav-item:active{transform:scale(.93)}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);
  padding:11px 20px;border-radius:14px;font-size:13px;font-weight:700;
  background:rgba(20,26,46,.95);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 16px 40px rgba(0,0,0,.7);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.9,.3,1);
  z-index:100;white-space:nowrap;color:#fff}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(74,227,255,.5);color:#9ff0ff}
.toast.err{border-color:rgba(255,90,90,.5);color:#ffb3b3}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="user">
      <div class="avatar" id="avatarEl">👤</div>
      <div>
        <div class="uname" id="unameEl">لاعب مجهول</div>
        <div class="urank">🥉 برونزي</div>
      </div>
    </div>
    <button class="icon-btn" id="soundBtn" title="الصوت">🔊</button>
  </header>

  <div class="hud">
    <div class="balance-row">
      <div class="coin-mini">◈</div>
      <div class="balance" id="balanceEl">0</div>
    </div>
    <div class="profit"><span class="dot"></span> +<span id="profitEl">0</span> / ساعة</div>
  </div>

  <div class="tap-area" id="tapArea">
    <div class="coin-wrap">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="coin" id="coin"><span class="symbol">◈</span></div>
    </div>
  </div>

  <div class="energy-wrap" id="energyWrap">
    <div class="energy-top">
      <span class="lbl">⚡ الطاقة</span>
      <span class="val" id="energyText">1000 / 1000</span>
    </div>
    <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
  </div>

  <div class="boosts" id="boosts">
    <button class="boost" data-key="multi">
      <div class="b-ico">👆</div><div class="b-name">نقرة قوية</div>
      <div class="b-lv">مستوى <span data-lv>1</span></div>
      <div class="b-cost"><span class="c">◈</span><span data-cost>150</span></div>
    </button>
    <button class="boost" data-key="energy">
      <div class="b-ico">🔋</div><div class="b-name">طاقة قصوى</div>
      <div class="b-lv">مستوى <span data-lv>1</span></div>
      <div class="b-cost"><span class="c">◈</span><span data-cost>250</span></div>
    </button>
    <button class="boost" data-key="regen">
      <div class="b-ico">⚡</div><div class="b-name">شحن سريع</div>
      <div class="b-lv">مستوى <span data-lv>1</span></div>
      <div class="b-cost"><span class="c">◈</span><span data-cost>400</span></div>
    </button>
    <button class="boost" data-key="auto">
      <div class="b-ico">🤖</div><div class="b-name">روبوت تعدين</div>
      <div class="b-lv">مستوى <span data-lv>1</span></div>
      <div class="b-cost"><span class="c">◈</span><span data-cost>600</span></div>
    </button>
  </div>

  <nav class="nav">
    <button class="nav-item active" data-nav="home"><span class="ni">🪙</span>الرئيسية</button>
    <button class="nav-item" data-nav="tasks"><span class="ni">🎯</span>المهام</button>
    <button class="nav-item" data-nav="friends"><span class="ni">👥</span>الأصدقاء</button>
    <button class="nav-item" data-nav="wallet"><span class="ni">💳</span>المحفظة</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   CoinTap — CloudStorage Edition
   البيانات تُحفظ في سحابة تلغرام (أو localStorage كبديل)
   ========================================================== */

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- Telegram WebApp ---------- */
const tg = window.Telegram?.WebApp;
const hasCloud = !!tg?.CloudStorage;

if(tg){
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0b0f22');
  tg.setBackgroundColor('#05060d');
  // عرض اسم المستخدم الحقيقي
  const u = tg.initDataUnsafe?.user;
  if(u){
    $('#unameEl').textContent = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'لاعب';
    if(u.photo_url){
      $('#avatarEl').innerHTML = `<img src="${u.photo_url}" style="width:100%;height:100%;border-radius:14px;object-fit:cover">`;
    } else {
      $('#avatarEl').textContent = (u.first_name || '👤').charAt(0).toUpperCase();
    }
  }
}

/* ---------- State ---------- */
const DEFAULT = {
  balance: 0, energy: 1000, maxEnergy: 1000,
  multiTap: 1, regen: 3, passive: 0,
  lv: { multi: 1, energy: 1, regen: 1, auto: 1 }
};

const KEY = 'cointap_v1';
let S = structuredClone(DEFAULT);

/* ---------- CloudStorage helpers (Promise wrappers) ---------- */
function tgGet(key){
  return new Promise((res, rej) => {
    tg.CloudStorage.getItem(key, (err, val) => err ? rej(err) : res(val));
  });
}
function tgSet(key, val){
  return new Promise((res, rej) => {
    tg.CloudStorage.setItem(key, val, (err) => err ? rej(err) : res());
  });
}

/* ---------- Load ---------- */
async function loadState(){
  // 1) CloudStorage
  if(hasCloud){
    try{
      const raw = await tgGet(KEY);
      if(raw){
        const d = JSON.parse(raw);
        return { ...structuredClone(DEFAULT), ...d, lv: { ...DEFAULT.lv, ...(d.lv||{}) } };
      }
    }catch(e){ console.warn('CloudStorage load failed:', e); }
  }
  // 2) Fallback localStorage
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      return { ...structuredClone(DEFAULT), ...d, lv: { ...DEFAULT.lv, ...(d.lv||{}) } };
    }
  }catch(e){}
  return structuredClone(DEFAULT);
}

/* ---------- Save (debounced + coalesced) ---------- */
let saving = false, needsSave = false, saveTimer = null;

async function doSave(){
  if(saving){ needsSave = true; return; }
  saving = true;
  const raw = JSON.stringify(S);
  try{
    if(hasCloud) await tgSet(KEY, raw);
    try{ localStorage.setItem(KEY, raw); }catch(e){}
  }catch(e){
    console.warn('CloudStorage save failed:', e);
    try{ localStorage.setItem(KEY, raw); }catch(e){}
  }finally{
    saving = false;
    if(needsSave){ needsSave = false; setTimeout(doSave, 250); }
  }
}

function save(immediate = false){
  if(immediate){ clearTimeout(saveTimer); doSave(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}

/* ---------- Costs ---------- */
const COST = {
  multi:  lv => Math.floor(150 * Math.pow(1.75, lv - 1)),
  energy: lv => Math.floor(250 * Math.pow(1.6,  lv - 1)),
  regen:  lv => Math.floor(400 * Math.pow(1.65, lv - 1)),
  auto:   lv => Math.floor(600 * Math.pow(1.7,  lv - 1))
};

/* ---------- Formatting ---------- */
function fmt(n){
  n = Math.floor(n);
  if(n < 1000) return n.toLocaleString('en-US');
  if(n < 1e6)  return (n/1e3).toFixed(2).replace(/\.?0+$/,'') + 'K';
  if(n < 1e9)  return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if(n < 1e12) return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + 'B';
  return (n/1e12).toFixed(2).replace(/\.?0+$/,'') + 'T';
}

/* ---------- Elements ---------- */
const balanceEl  = $('#balanceEl');
const profitEl   = $('#profitEl');
const energyText = $('#energyText');
const energyFill = $('#energyFill');
const energyWrap = $('#energyWrap');
const coinEl     = $('#coin');
const tapArea    = $('#tapArea');
const toastEl    = $('#toast');

/* ---------- Render ---------- */
function render(){
  balanceEl.textContent = fmt(S.balance);
  profitEl.textContent  = fmt(S.passive * 3600);
  const pct = Math.max(0, Math.min(1, S.energy / S.maxEnergy));
  energyFill.style.width = (pct * 100) + '%';
  energyText.textContent = `${Math.floor(S.energy)} / ${fmt(S.maxEnergy)}`;
  energyWrap.classList.toggle('low', pct < 0.2);
  $$('.boost').forEach(btn => {
    const key = btn.dataset.key;
    const lv  = S.lv[key];
    btn.querySelector('[data-lv]').textContent   = lv;
    btn.querySelector('[data-cost]').textContent = fmt(COST[key](lv));
    btn.classList.toggle('affordable', S.balance >= COST[key](lv));
  });
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, type = ''){
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.className = 'toast ' + type, 1700);
}

/* ---------- Haptics ---------- */
function haptic(ms = 8){
  if(tg?.HapticFeedback){
    try{ tg.HapticFeedback.impactOccurred('light'); return; }catch(e){}
  }
  if(navigator.vibrate) navigator.vibrate(ms);
}

/* ---------- Sound ---------- */
let audioCtx = null, soundOn = true;
function blip(freq = 620, dur = 0.07, type = 'sine', vol = 0.06){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 0.65, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

/* ---------- Tap effects ---------- */
function spawnFloat(x, y, amount){
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = '+' + amount;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.fontSize = (20 + Math.min(10, S.multiTap)) + 'px';
  tapArea.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function spawnRipple(x, y){
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  tapArea.appendChild(el);
  setTimeout(() => el.remove(), 620);
}
function spawnSparks(x, y){
  for(let i = 0; i < 5; i++){
    const el = document.createElement('div');
    el.className = 'spark';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    tapArea.appendChild(el);
    const angle = Math.random() * Math.PI * 2;
    const dist  = 34 + Math.random() * 46;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
    ], { duration: 520 + Math.random() * 200, easing: 'cubic-bezier(.2,.7,.4,1)' });
    setTimeout(() => el.remove(), 760);
  }
}

/* ---------- Core tap ---------- */
let lastTap = 0;
function doTap(clientX, clientY){
  const rect = tapArea.getBoundingClientRect();
  if(S.energy < 1){
    energyWrap.classList.add('shake');
    setTimeout(() => energyWrap.classList.remove('shake'), 380);
    haptic([18, 40, 18]);
    toast('⚡ الطاقة نفدت، انتظر قليلاً', 'err');
    return;
  }
  S.energy -= 1;
  const gain = S.multiTap;
  S.balance += gain;
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  spawnFloat(x, y, gain);
  spawnRipple(x, y);
  spawnSparks(x, y);
  coinEl.classList.add('pressed');
  setTimeout(() => coinEl.classList.remove('pressed'), 90);
  haptic(8);
  const now = performance.now();
  if(now - lastTap > 55) blip(560 + Math.random() * 140, 0.06, 'sine', 0.045);
  lastTap = now;
  render();
}

tapArea.addEventListener('pointerdown', e => {
  if(e.button !== undefined && e.button !== 0) return;
  doTap(e.clientX, e.clientY);
});
tapArea.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- Boosts ---------- */
$$('.boost').forEach(btn => {
  btn.addEventListener('click', () => {
    const key  = btn.dataset.key;
    const lv   = S.lv[key];
    const cost = COST[key](lv);
    if(S.balance < cost){
      haptic([15, 50, 15]);
      toast('◈ رصيدك غير كافٍ', 'err');
      btn.animate(
        [{ transform:'translateX(0)' },{ transform:'translateX(-6px)' },
         { transform:'translateX(6px)' },{ transform:'translateX(0)' }],
        { duration: 300 }
      );
      return;
    }
    S.balance -= cost;
    S.lv[key]++;
    switch(key){
      case 'multi':  S.multiTap  += 1; break;
      case 'energy': S.maxEnergy += 500; S.energy += 500; break;
      case 'regen':  S.regen     += 2; break;
      case 'auto':   S.passive   += 5; break;
    }
    haptic([10, 30, 10]);
    blip(880, 0.12, 'triangle', 0.06);
    toast('✅ تم الترقية بنجاح!', 'ok');
    btn.animate(
      [{ transform:'scale(1)' },{ transform:'scale(1.1)' },{ transform:'scale(1)' }],
      { duration: 320, easing: 'cubic-bezier(.34,1.6,.64,1)' }
    );
    render();
    save(true); // حفظ فوري بعد شراء ترقية
  });
});

/* ---------- Bottom nav ---------- */
$$('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    $$('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    haptic(6);
    blip(420, 0.05, 'square', 0.03);
    const map = {
      home:    '🏠 الرئيسية',
      tasks:   '🎯 المهام — قريباً',
      friends: '👥 الأصدقاء — قريباً',
      wallet:  '💳 المحفظة — قريباً'
    };
    const key = item.dataset.nav;
    if(key !== 'home') toast(map[key]);
  });
});

/* ---------- Sound toggle ---------- */
$('#soundBtn').addEventListener('click', e => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
  haptic(8);
  if(soundOn) blip(700, 0.08);
});

/* ---------- Game loop ---------- */
let acc = 0;
setInterval(() => {
  if(S.energy < S.maxEnergy){
    S.energy = Math.min(S.maxEnergy, S.energy + S.regen / 10);
  }
  if(S.passive > 0){
    S.balance += S.passive / 10;
  }
  acc++;
  render();
  // حفظ كل 10 ثوانٍ (بدلاً من 3) لتقليل استدعاءات CloudStorage
  if(acc % 100 === 0) save();
}, 100);

document.addEventListener('visibilitychange', () => {
  if(document.hidden) save(true);
});
window.addEventListener('beforeunload', save);

/* ---------- Init ---------- */
(async () => {
  S = await loadState();
  render();
  setTimeout(() => {
    if(hasCloud) toast('☁️ البيانات محفوظة في سحابة تلغرام');
    else toast('👆 اضغط على العملة لتبدأ الربح');
  }, 700);
})();
</script>
</body>
</html>
