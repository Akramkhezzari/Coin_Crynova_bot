<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Reels - Crynova</title>

<!-- سكريبت تيليجرام Web App — يجب أن يكون أول سكريبت -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

  /* حاوية الريلز — تمرير عمودي مع snap */
  #reels{
    height:100dvh;height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  #reels::-webkit-scrollbar{display:none}

  .reel{
    height:100dvh;height:100vh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    position:relative;
    background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  .reel video{
    width:100%;height:100%;
    object-fit:contain;
    background:#000;
  }

  /* زر تشغيل وسط الشاشة عند الإيقاف */
  .play-btn{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:70px;height:70px;border-radius:50%;
    background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;pointer-events:none;
    opacity:0;transition:opacity .2s;
  }
  .reel.paused .play-btn{opacity:1}

  /* النص أسفل الفيديو */
  .caption{
    position:absolute;bottom:20px;right:14px;left:14px;
    color:#fff;font-size:14px;line-height:1.45;
    text-shadow:0 1px 4px rgba(0,0,0,.95);
    max-height:38%;overflow:hidden;
    background:linear-gradient(transparent,rgba(0,0,0,.4));
    padding:12px 8px;border-radius:10px;
  }
  .meta{font-size:11px;opacity:.7;margin-top:6px}

  /* أزرار التفاعل يسار الشاشة */
  .actions{
    position:absolute;bottom:120px;left:10px;
    display:flex;flex-direction:column;gap:22px;
    font-size:26px;text-align:center;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));
    z-index:2;
  }
  .actions .btn{
    cursor:pointer;user-select:none;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:transform .15s;
  }
  .actions .btn:active{transform:scale(.9)}
  .actions .cnt{font-size:11px;filter:none;text-shadow:0 1px 2px #000}
  .like.liked{transform:scale(1.15)}

  /* شاشات التحميل / الخطأ */
  .state{
    height:100dvh;height:100vh;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;padding:24px;text-align:center;
    color:#999;font-size:15px;
  }
  .state.error{color:#f66}
  .state .sub{font-size:12px;opacity:.65;line-height:1.6;color:#ccc}
  .state .hint{font-size:11px;opacity:.5;margin-top:12px;max-width:280px}
  .spinner{
    width:36px;height:36px;border:3px solid rgba(255,255,255,.15);
    border-top-color:#fff;border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="reels">
  <div class="state">
    <div class="spinner"></div>
    <div>جارٍ جلب الفيديوهات...</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ⚙️  الإعدادات — عدّل هنا فقط
   ═══════════════════════════════════════════════════════════ */
const CHANNEL = 'Crynova_dz';   // ✅ تم تصحيح اسم القناة هنا

// وسطاء CORS — الكود يجرّبهم بالترتيب حتى ينجح أحدهم
const PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://api.codetabs.com/v1/proxy?quest=',
  'https://corsproxy.io/?url='
];
/* ═══════════════════════════════════════════════════════════ */


/* ─────────── تهيئة تيليجرام Web App ─────────── */
const tg = window.Telegram?.WebApp;
if (tg){
  try{
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.('#000000');
    tg.setBackgroundColor?.('#000000');
    tg.disableVerticalSwipes?.();  // حتى لا يغلق التطبيق أثناء التمرير
  }catch(e){ /* تجاهل — يعمل أيضاً خارج تيليجرام */ }
}


/* ─────────── أدوات مساعدة ─────────── */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtDate(iso){
  if(!iso) return '';
  try{
    return new Date(iso).toLocaleDateString('ar',{
      year:'numeric', month:'short', day:'numeric'
    });
  }catch{ return ''; }
}


/* ─────────── جلب صفحة القناة ─────────── */
async function fetchChannelHTML(){
  const target = `https://t.me/s/${CHANNEL}`;
  let lastErr;
  for (const proxy of PROXIES){
    try{
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 15000); // مهلة 15 ثانية
      const res = await fetch(proxy + encodeURIComponent(target), {
        signal: ctrl.signal,
        cache: 'no-store'
      });
      clearTimeout(to);
      if (res.ok){
        const text = await res.text();
        if (text && text.includes('tgme_widget_message')) return text;
        lastErr = new Error('استجابة فارغة');
      } else {
        lastErr = new Error('HTTP ' + res.status);
      }
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('فشل جميع الوسطاء');
}


/* ─────────── استخراج الفيديوهات من HTML ─────────── */
function parseVideos(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const posts = doc.querySelectorAll('.tgme_widget_message');
  const out = [];

  posts.forEach(post => {
    const video = post.querySelector('video');
    if (!video) return;

    let src = video.getAttribute('src') || '';
    if (!src) return;
    if (src.startsWith('//'))      src = 'https:' + src;
    else if (src.startsWith('/'))  src = 'https://t.me' + src;

    const capEl   = post.querySelector('.tgme_widget_message_text');
    const caption = capEl ? capEl.textContent.trim() : '';

    const timeEl  = post.querySelector('time');
    const date    = timeEl ? timeEl.getAttribute('datetime') : '';

    const viewsEl = post.querySelector('.tgme_widget_message_views');
    const views   = viewsEl ? viewsEl.textContent.trim() : '';

    const likes   = Math.floor(Math.random() * 200) + 10; // مؤقت — عرض فقط

    out.push({ src, caption, date, views, likes });
  });

  return out.reverse(); // الأحدث أولاً
}


/* ─────────── رسم الريلز ─────────── */
function render(reels){
  const root = document.getElementById('reels');

  if (!reels.length){
    root.innerHTML = `
      <div class="state">
        <div>لا توجد فيديوهات في آخر منشورات القناة</div>
        <div class="sub">تأكد أن القناة عامة وأن اسم <b>${escapeHtml(CHANNEL)}</b> صحيح</div>
        <div class="hint">أرسل فيديو في القناة، أو جرّب قناة تحتوي فيديوهات حديثة</div>
      </div>`;
    return;
  }

  root.innerHTML = reels.map(r => `
    <div class="reel paused">
      <video src="${escapeHtml(r.src)}"
             loop playsinline muted preload="metadata"
             webkit-playsinline
             disablepictureinpicture
             controlslist="nodownload noplaybackrate"></video>

      <div class="play-btn">▶</div>

      <div class="actions">
        <span class="btn like" data-count="${r.likes}">❤️<span class="cnt">${r.likes}</span></span>
        <span class="btn share">↗️<span class="cnt">مشاركة</span></span>
      </div>

      ${r.caption ? `
        <div class="caption">
          ${escapeHtml(r.caption)}
          <div class="meta">${fmtDate(r.date)}${r.views ? ' · 👁 ' + escapeHtml(r.views) : ''}</div>
        </div>` : ''}
    </div>
  `).join('');

  // مراقبة الفيديو المرئي ليشغّل تلقائياً
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const video = entry.target;
      const reel  = video.parentElement;

      if (entry.intersectionRatio > 0.6){
        video.muted = true;
        video.play().then(() => reel.classList.remove('paused')).catch(()=>{});
      } else {
        video.pause();
        reel.classList.add('paused');
      }
    });
  }, { threshold: [0, 0.6, 1] });

  root.querySelectorAll('.reel video').forEach(v => io.observe(v));
}


/* ─────────── التفاعل مع النقر ─────────── */
document.addEventListener('click', e => {

  // زر الإعجاب
  const like = e.target.closest('.like');
  if (like){
    const liked = like.classList.toggle('liked');
    const cnt = like.querySelector('.cnt');
    cnt.textContent = (+like.dataset.count || 0) + (liked ? 1 : 0);
    return;
  }

  // زر المشاركة
  const share = e.target.closest('.share');
  if (share){
    const video = share.closest('.reel').querySelector('video');
    if (navigator.share){
      navigator.share({ url: video.src }).catch(()=>{});
    } else {
      navigator.clipboard?.writeText(video.src);
      alert('تم نسخ الرابط');
    }
    return;
  }

  // تشغيل / إيقاف الفيديو
  const reel = e.target.closest('.reel');
  if (!reel) return;
  const video = reel.querySelector('video');
  if (!video) return;

  if (video.paused){
    video.muted = false;
    video.play().then(() => reel.classList.remove('paused')).catch(()=>{});
  } else {
    video.pause();
    reel.classList.add('paused');
  }
});


/* ─────────── نقطة الانطلاق ─────────── */
(async function init(){
  try{
    const html  = await fetchChannelHTML();
    const reels = parseVideos(html);
    render(reels);
  }catch(err){
    document.getElementById('reels').innerHTML = `
      <div class="state error">
        <div style="font-size:20px">⚠️</div>
        <div>تعذر جلب الفيديوهات</div>
        <div class="sub">${escapeHtml(err.message || 'خطأ غير معروف')}</div>
        <div class="hint">
          تحقق من:<br>
          • أن القناة عامة (public)<br>
          • أن الاسم صحيح بدون @<br>
          • أن اتصالك بالإنترنت يعمل<br>
          • أن t.me غير محجوب على شبكتك
        </div>
      </div>`;
  }
})();
</script>

</body>
</html>
